name: CD

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish (for example v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: cd-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  meta:
    name: verify tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - id: version
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${DISPATCH_TAG:-$GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "invalid release tag: $tag" >&2
            exit 1
          fi
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "festival-cli") | .version')
          if [ "v$version" != "$tag" ]; then
            echo "tag $tag does not match Cargo workspace version $version" >&2
            exit 1
          fi
          git rev-parse "refs/tags/$tag" >/dev/null
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    name: test (${{ matrix.os }})
    needs: meta
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  build:
    name: build (${{ matrix.asset }})
    needs: [meta, test]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: linux-x86
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: linux-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: windows-x86
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset: windows-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: macos-x86
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: macos-aarch64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }} -p festival-cli
      - name: Strip binary
        if: runner.os != 'Windows'
        run: strip "target/${{ matrix.target }}/release/festival-rs"
      - uses: actions/upload-artifact@v7
        with:
          name: festival-rs-${{ matrix.asset }}
          path: target/${{ matrix.target }}/release/festival-rs${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error
          retention-days: 3

  release:
    name: publish release
    needs: [meta, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          pattern: festival-rs-*
          path: dist
      - name: Package archives and checksums
        env:
          TAG: ${{ needs.meta.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          version="${TAG#v}"
          for dir in dist/festival-rs-*; do
            platform="${dir#dist/festival-rs-}"
            name="festival-rs-$version-$platform"
            mkdir -p "$name"
            cp "$dir"/festival-rs* "$name"/
            cp README.md LICENSE-APACHE LICENSE-MIT "$name"/
            if [[ "$platform" == windows-* ]]; then
              zip -qr "$name.zip" "$name"
            else
              chmod +x "$name/festival-rs"
              tar -czf "$name.tar.gz" "$name"
            fi
            rm -rf "$name"
          done
          sha256sum festival-rs-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(festival-rs-*.tar.gz festival-rs-*.zip SHA256SUMS.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --title "festival-rs $TAG" --generate-notes
          fi
