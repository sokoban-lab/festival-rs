[workspace]
members = [
    "crates/festival-core",
    "crates/festival-cli",
    "crates/festival-bench",
]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
festival-core = { path = "crates/festival-core" }
log = "0.4"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
mimalloc = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.bench]
lto = "thin"
codegen-units = 1
