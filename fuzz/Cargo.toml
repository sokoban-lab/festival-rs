[package]
name = "festival-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
festival-core = { path = "../crates/festival-core" }

[workspace]

[[bin]]
name = "parser"
path = "fuzz_targets/parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lurd"
path = "fuzz_targets/lurd.rs"
test = false
doc = false
bench = false

[[bin]]
name = "moves"
path = "fuzz_targets/moves.rs"
test = false
doc = false
bench = false
